services:
  wakepdi:
    build: .
    image: wake-pdi:local
    command: ["python", "wake.py", "--help"]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      WAKE_PDI_AUTH_MODE: browser
      WAKE_PDI_BROWSER: firefox
      HOME: /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=5678,gid=5678,mode=1777,size=256m
      - /app/logs:uid=5678,gid=5678,mode=0750,size=32m
